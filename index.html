<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>🎯 Age Milestone Explorer</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="card" id="card">
    <!-- FORM VIEW -->
    <div id="form-view">
      <h1>🎈 When were you born?</h1>
      <form id="dob-form">
        <label for="dob">📅 Date of Birth</label>
        <input type="date" id="dob" required />
      
        <label for="hour">🕒 Hour (0–23)</label>
        <select id="hour" required></select>
      
        <label for="minute">⏱ Minute (0–59)</label>
        <select id="minute" required></select>
      
        <button type="submit">🔍 Find Milestone</button>
      </form>
    </div>

    <!-- RESULT SUMMARY VIEW -->
    <div id="result-view" style="display: none;">
      <h2>🎉 You Are This Old</h2>
      <p class="note">...in case you're wondering 👇</p>
      <div id="current-ages"></div>

      <h3>⏳ Progress to Next Milestones</h3>
      <div id="milestone-progress"></div>

      <button id="go-back" class="secondary">← Back</button>
    </div>

    <!-- UNIT EXPLORER VIEW -->
    <div id="unit-explorer" style="display: none;">
      <h2 id="unit-title">📊 [Unit] Milestones</h2>
      <div id="unit-milestones"></div>
      <button id="back-to-summary" class="secondary">← Back to Summary</button>
    </div>

    <!-- COUNTDOWN VIEW -->
    <div id="countdown-view" style="display: none;">
      <h2 id="countdown-label"></h2>
      <p id="countdown-eta"></p>
      <div id="countdown-timer" class="countdown-box">Loading...</div>
      <button id="back-to-unit" class="secondary">← Back to Milestones</button>
      <div id="countdown-buttons">
        <button id="copy-share-link" class="neutral">🔗 Copy Shareable Link</button>
        <button id="add-to-calendar" class="add">📅 Add to Calendar</button>
        <button id="google-calendar-link" class="google">🤖 Add to Google Calendar</button>
      </div>      
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
